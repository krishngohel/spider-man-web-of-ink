<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spider-Man: Web of Ink (unofficial fan game)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #0d1020; overflow: hidden; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #f2e6c9; color: #10101a; font-family: 'Bangers', Impact, sans-serif; z-index: 50; }
    #loading .box { text-align: center; }
    #loading h1 { font-size: clamp(36px, 7vw, 88px); margin: 0; letter-spacing: 2px; color: #d4252f; text-shadow: 4px 4px 0 #10101a; }
    #loading .bar { width: min(420px, 70vw); height: 14px; border: 3px solid #10101a; margin: 24px auto 0; background: #fff; }
    #loading .bar i { display: block; height: 100%; width: 8%; background: #1d4fb8; }
    #loading .msg { display: none; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; margin-top: 18px; max-width: 520px; padding: 0 16px; }
    #loading.error .msg.err, #loading.mobile .msg.mob { display: block; }
    #loading.error .bar, #loading.mobile .bar { display: none; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="loading">
    <div class="box">
      <h1>WEB OF INK</h1>
      <div class="bar"><i></i></div>
      <p class="msg err">This game needs WebGL 2. Try a recent Chrome, Edge, Firefox or Safari on a computer.</p>
      <p class="msg mob">Web of Ink is made for a computer with a keyboard and mouse or a gamepad. Open this page on a laptop or desktop to play.</p>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
